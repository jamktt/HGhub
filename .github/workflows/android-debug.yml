
name: HGhub Android ARM64 Debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'


    
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          rm -rf "$ANDROID_HOME/ndk/30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV


      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

        

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

        
      - name: Configure Android Clang target
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

          echo "NDK_HOME=$NDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK" >> $GITHUB_ENV

          echo "BINDGEN_EXTRA_CLANG_ARGS=--target=aarch64-linux-android24 --sysroot=$SYSROOT" >> $GITHUB_ENV

          echo "BINDGEN_EXTRA_CLANG_ARGS_AARCH64_LINUX_ANDROID=--target=aarch64-linux-android24 --sysroot=$SYSROOT" >> $GITHUB_ENV

          echo "Using NDK: $NDK"
          echo "Using sysroot: $SYSROOT"


      - name: Initialize Android
        run: pnpm tauri android init --ci

      - name: Sync Android icons
        run: pnpm android:icons

      - name: Build ARM64 Debug APK
        run: pnpm tauri android build --debug --target aarch64 --apk --ci

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-ARM64-Debug-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
